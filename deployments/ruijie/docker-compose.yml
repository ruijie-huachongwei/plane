x-api-environment: &api-environment
  DEBUG: "0"
  WEB_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_HOST: plane-db
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB:-plane}
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379/
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  USE_MINIO: "0"
  AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:?AWS_S3_ENDPOINT_URL is required}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:?AWS_S3_BUCKET_NAME is required}
  SIGNED_URL_EXPIRATION: ${SIGNED_URL_EXPIRATION:-3600}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  MINIO_ENDPOINT_SSL: "1"
  APP_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  APP_BASE_PATH: /
  ADMIN_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  ADMIN_BASE_PATH: /god-mode/
  SPACE_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  SPACE_BASE_PATH: /spaces/
  LIVE_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  LIVE_BASE_PATH: /live/
  COOKIE_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY is required}
  IS_CAS_ENABLED: ${IS_CAS_ENABLED:-1}
  CAS_LOGIN_URL: ${CAS_LOGIN_URL:?CAS_LOGIN_URL is required}
  CAS_CALLBACK_URL: ${CAS_CALLBACK_URL:?CAS_CALLBACK_URL is required}
  CAS_IDENTITY_EXCHANGE_URL: ${CAS_IDENTITY_EXCHANGE_URL:?CAS_IDENTITY_EXCHANGE_URL is required}
  CAS_IDENTITY_EXCHANGE_SECRET: ${CAS_IDENTITY_EXCHANGE_SECRET:?CAS_IDENTITY_EXCHANGE_SECRET is required}
  CAS_RENEW: ${CAS_RENEW:-0}
  ENABLE_SIGNUP: ${ENABLE_SIGNUP:-1}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}

x-frontend-build-args: &frontend-build-args
  VITE_API_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  VITE_WEB_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  VITE_ADMIN_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  VITE_ADMIN_BASE_PATH: /god-mode
  VITE_SPACE_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  VITE_SPACE_BASE_PATH: /spaces
  VITE_LIVE_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  VITE_LIVE_BASE_PATH: /live

services:
  web:
    build:
      args:
        <<: *frontend-build-args

  admin:
    build:
      args:
        <<: *frontend-build-args
        VITE_API_BASE_PATH: /api
        VITE_WEB_BASE_PATH: ""

  space:
    build:
      args:
        <<: *frontend-build-args
        VITE_API_BASE_PATH: /api
        VITE_WEB_BASE_PATH: ""

  api:
    environment:
      <<: *api-environment
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    environment:
      <<: *api-environment

  beat-worker:
    environment:
      <<: *api-environment

  migrator:
    environment:
      <<: *api-environment

  live:
    environment:
      PORT: "3000"
      API_BASE_URL: http://api:8000
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL is required}
      LIVE_BASE_PATH: /live
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY is required}
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - api
      - plane-redis

  plane-minio:
    profiles:
      - minio

  proxy:
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
    volumes:
      - ./deployments/ruijie/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required}:/etc/caddy/certs:ro
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  proxy_config:
  proxy_data: